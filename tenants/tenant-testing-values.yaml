# Minimal tenant file to validate ApplicationSet auto-discovery: pushing a
# new tenants/tenant-*-values.yaml file should automatically produce a new
# Argo CD Application and deploy it, with no manual Application creation.
tenant:
  id: testing
  name: testing
  namespace: testing
  domain: testing.qraie.ai
imagePullSecrets:
- ocir-regcred
# Vault runs on the hub cluster; this tenant's pods run on the spoke, which
# can't resolve the hub-internal "vault.vault.svc" DNS name (chart default,
# fine for a single-cluster deployment). Override with the cross-cluster
# NodePort address instead.
vault:
  server: http://192.168.85.201:30820

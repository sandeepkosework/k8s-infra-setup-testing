# tenant.id must be lowercase (RFC 1123) — it's used verbatim in
# Deployment/Service/PVC/Secret names. Apps that need an uppercase tenant
# identifier get one automatically via the TENANT_ID env var, which the
# chart derives as {{ .Values.tenant.id | upper }}.
tenant:
  id: hbss
  name: hbss
  namespace: hbss
  domain: hbss-bridgestg.qraie.ai
imagePullSecrets:
- ocir-regcred
# Vault runs on the hub cluster; this tenant's pods run on the spoke, which
# can't resolve the hub-internal "vault.vault.svc" DNS name (chart default,
# fine for a single-cluster deployment). Override with the cross-cluster
# NodePort address instead.
vault:
  server: http://192.168.85.201:30820
ingress:
  enabled: true
  className: nginx
  tls:
    enabled: false
    secretName: ""
# commonSecrets / tenantSecrets / serviceSecrets all default to sensible
# Vault paths derived from tenant.id (see values.yaml) — no override needed
# here.
persistence:
  # Only consumed by prism-backend/voxflow, both disabled below (not part of
  # hbss's real stack) — disabling here too so no orphaned PVCs get created.
  prism-videos:
    enabled: false
  voxflow-agents:
    enabled: false
  voxflow-mcp:
    enabled: false
# services can no longer be partially overridden per-tenant now that the
# chart's services: is a list, not a map (Helm replaces whole lists on
# override rather than deep-merging elements) — disabledServices is the only
# per-tenant lever left, matching qraie-bridge's own design. Every service's
# env now always reads from its own fixed Vault path
# (secret/tenants/hbss/<service>); there's no more per-key redirect to a
# shared secret.
#
# Services not present in hbss's real docker-compose.yml at all
# (enrollment-api, iot-broker-*, prism-*, voxflow) are disabled — they were
# prototype-specific additions that leaked into this chart's "generic"
# defaults, not part of hbss's real stack.
disabledServices:
  - enrollment-api
  - iot-broker-admin
  - iot-broker-broker
  - iot-broker-config
  - iot-broker-data
  - iot-broker-loconav-vision
  - iot-broker-web
  - prism-ui
  - prism-backend
  - prism-scanner
  - voxflow
